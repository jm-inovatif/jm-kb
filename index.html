<style>

  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:14px 18px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.sweep.red{background:conic-gradient(from 0deg,rgba(255,46,99,0) 0deg,rgba(255,46,99,0) 300deg,rgba(255,46,99,.12) 358deg,rgba(255,46,99,.32) 360deg)}

.mapbox.ops .grat{stroke:rgba(124,255,107,.12)}

.week{display:grid;gap:4px}
.week .dy{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:start;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(async function(){
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=n=>Number(n).toLocaleString('en-MY');
const NAMA={KDH:'Kedah',KTN:'Kelantan',PRK:'Perak',PNG:'Pulau Pinang',KUL:'WP Kuala Lumpur',NSN:'Negeri Sembilan',MLK:'Melaka',PLS:'Perlis',PHG:'Pahang',TRG:'Terengganu',PJY:'WP Putrajaya',LBN:'WP Labuan',SGR:'Selangor',SBH:'Sabah',JHR:'Johor',SWK:'Sarawak'};
const DUNST={'Perlis':'PLS','Kedah':'KDH','Kelantan':'KTN','Terengganu':'TRG','Pulau Pinang':'PNG','Perak':'PRK','Pahang':'PHG','Selangor':'SGR','Negeri Sembilan':'NSN','Melaka':'MLK','Johor':'JHR','Sabah':'SBH','Sarawak':'SWK'};
// model colour slots, ordered by overall volume
const MSLOT={SAGA:1,PERSONA:2,X50:3,EXORA:4,X70:5,IRIZ:6,PREVE:7,S70:8,X90:9};
const mcol=m=>css('--m'+(MSLOT[m]||0));
// one hue per state, spread round the wheel so neighbours differ
const STH={KTN:212,TRG:185,PHG:140,JHR:28,SGR:275,KUL:330,PJY:300,NSN:50,MLK:2,PRK:95,KDH:65,PLS:160,PNG:245,SBH:15,SWK:115,LBN:350};
const stCol=(st,l)=>d3.hsl(STH[st]??0,.62,l??.47);

let G,DS,POP,TG;
try{
  const [s,d,u,sept,cust,pop,tg]=await Promise.all(['g_state.json','g_district.json','g_dun.json','data.json','cust.json','pop.json','target.json'].map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
  G={negeri:s,daerah:d,dun:u}; POP=pop; TG=tg;
  DS={
    cust:{label:cust.label,gLabel:'Tahun',unit:'customer',rows:cust.rows.map(r=>({st:r[0],d:r[1],n:r[2],m:r[3],g:r[4],src:r[5]}))},
    sept:{label:sept.sumber,gLabel:'SA',unit:'unit',rows:sept.rows.map(r=>({st:r[0],d:'',n:'',m:r[2],g:r[1],v:r[3],b:r[4]}))}
  };
}catch(e){document.getElementById('panel').innerHTML='<p class="empty">Fail peta tak dapat dimuatkan ('+e.message+'). Muat semula halaman.</p>';return}

let ds='cust', R=DS.cust.rows, level='negeri', mode='radar', selected=null;
const key={negeri:f=>f.properties.state, daerah:f=>f.properties.state+'|'+f.properties.name.toUpperCase(), dun:f=>(DUNST[f.properties.state]||'')+'|'+f.properties.dun.toUpperCase()};
const rowKey={negeri:r=>r.st||null, daerah:r=>r.d||null, dun:r=>r.n||null};
const nameOf={negeri:f=>NAMA[f.properties.state]||f.properties.name, daerah:f=>f.properties.name, dun:f=>f.properties.dun.replace(/^N\.\d+\s*/,'')};
const featByKey={};['negeri','daerah','dun'].forEach(l=>{featByKey[l]=new Map(G[l].features.map(f=>[key[l](f),f]))});
const SRC={dun:'Nama kawasan DUN dalam alamat',bandar:'Nama bandar dalam alamat',poskod:'Poskod dalam alamat'};
const LV={negeri:'negeri',daerah:'daerah',dun:'kawasan DUN'};
const tgOf=f=>level==='daerah'?TG.D[key.daerah(f)]:level==='dun'?TG.N[key.dun(f)]:null;
const popOf=f=>level==='daerah'?POP.d[key.daerah(f)]:null;

function fill(sel,vals,all){sel.innerHTML='';[['',all],...vals.map(v=>[v,v])].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)})}
function setDS(){
  R=DS[ds].rows; fsaL.textContent=DS[ds].gLabel;
  fill(fsa,[...new Set(R.map(r=>r.g).filter(Boolean))].sort(),ds==='cust'?'Semua tahun':'Semua SA');
  fill(fmd,[...new Set(R.map(r=>r.m))].sort(),'Semua model');
  document.getElementById('sub').textContent=DS[ds].label+' · Proton JM Otomobil Inovatif';
}
setDS();
const filt=()=>R.filter(r=>(!fsa.value||r.g===fsa.value)&&(!fmd.value||r.m===fmd.value));

// per-area aggregates: count + model tally
function agg(rows){
  const m=new Map();
  rows.forEach(r=>{const k=rowKey[level](r);if(!k)return;let a=m.get(k);if(!a){a={n:0,mod:new Map()};m.set(k,a)}a.n++;a.mod.set(r.m,(a.mod.get(r.m)||0)+1)});
  m.forEach(a=>{a.top=[...a.mod].sort((x,y)=>y[1]-x[1])});
  return m;
}

const svg=d3.select('#map'), box=document.getElementById('mapbox');
const defs=svg.append('defs');
defs.append('filter').attr('id','blur').attr('primitiveUnits','objectBoundingBox').attr('x','-60%').attr('y','-60%').attr('width','220%').attr('height','220%').append('feGaussianBlur').attr('stdDeviation',.07);
const gRoot=svg.append('g'), gTile=gRoot.append('g').attr('class','tiles'), gGrat=gRoot.append('g'), gShape=gRoot.append('g').attr('class','shp'), gRadar=gRoot.append('g').attr('class','radar'), gLine=gRoot.append('g'), gLab=gRoot.append('g'), gBadge=gRoot.append('g'), gRoute=gRoot.append('g'), gTgt=gRoot.append('g'), gPin=gRoot.append('g');
const TGC=()=>d3.interpolateRgbBasis(['--g0','--g1','--g2','--g3','--g4'].map(css));
const RAMP=()=>d3.interpolateRgbBasis(['--r1','--r2','--r3','--r4','--r5','--r6','--r7'].map(css));
const TEMP=()=>d3.interpolateRgbBasis(['--t1','--t2','--t3','--t4','--t5'].map(css));
let W=box.clientWidth,H=box.clientHeight;
const proj=d3.geoMercator(), path=d3.geoPath(proj);
function fitProj(){W=box.clientWidth;H=box.clientHeight;svg.attr('viewBox',[0,0,W,H]);proj.fitExtent([[20,20],[W-20,H-20]],W<640?{type:'FeatureCollection',features:G.negeri.features.filter(f=>!['SBH','SWK','LBN'].includes(f.properties.state))}:G.negeri);gGrat.selectAll('path').data([d3.geoGraticule().extent([[95,-2],[122,12]]).step([1,1])()]).join('path').attr('class','grat').attr('d',path)}
fitProj();
let BW=new WeakMap();
const zoom=d3.zoom().scaleExtent([1,400]).clickDistance(6).on('zoom',e=>{gRoot.attr('transform',e.transform);rescale(e.transform.k);schedTiles()});
svg.call(zoom).on('dblclick.zoom',null);
const hud=document.getElementById('hud');
svg.on('mousemove.hud',e=>{const t=d3.zoomTransform(svg.node());const [x,y]=t.invert(d3.pointer(e));const ll=proj.invert([x,y]);if(ll)hud.textContent=`${Math.abs(ll[1]).toFixed(2)}°${ll[1]>=0?'U':'S'}  ${ll[0].toFixed(2)}°T`});
/* ===== Peta jalan (jubin CARTO/OSM, perlu internet) ===== */
const GURL=o=>`https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lon}`;
const gLink=(o,t)=>`<a class="gmap" href="${GURL(o)}" target="_blank" rel="noopener">📍 ${t||'Maps'}</a>`;
let tileErr=0;
let tT;const schedTiles=()=>{clearTimeout(tT);tT=setTimeout(drawTiles,120)};
function drawTiles(){
  const on=document.getElementById('tgR').checked;svg.classed('roads',on);document.getElementById('osm').hidden=!on;
  if(!on){gTile.selectAll('image').remove();return}
  const t=d3.zoomTransform(svg.node()), dpr=Math.min(2,window.devicePixelRatio||1);
  const world=proj.scale()*2*Math.PI*t.k;
  const z=Math.max(3,Math.min(18,Math.round(Math.log2(world*dpr/256)))), n=2**z;
  const c1=proj.invert(t.invert([0,0])), c2=proj.invert(t.invert([W,H]));
  const tx=lon=>Math.floor((lon+180)/360*n), ty=lat=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
  const lonOf=x=>x/n*360-180, latOf=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI;
  const x0=Math.max(0,tx(c1[0])), x1=Math.min(n-1,tx(c2[0])), y0=Math.max(0,ty(c1[1])), y1=Math.min(n-1,ty(c2[1]));
  const tiles=[];if((x1-x0+1)*(y1-y0+1)<=120)for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const a=proj([lonOf(x),latOf(y)]),b=proj([lonOf(x+1),latOf(y+1)]);tiles.push({id:z+'/'+x+'/'+y,x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1],u:`https://tile.openstreetmap.org/${z}/${x}/${y}.png`})}
  gTile.selectAll('image').data(tiles,d=>d.id).join(en=>en.append('image').attr('preserveAspectRatio','none').on('error',function(){tileErr++;const o=document.getElementById('osm');o.classList.add('err');o.textContent='⚠️ Peta jalan tak dapat dimuat — perlu internet. Kalau dibuka terus dalam WhatsApp atau HTML Viewer, buka semula fail ni dengan Chrome.'}).on('load',function(){if(!tileErr)return;tileErr=0;const o=document.getElementById('osm');o.classList.remove('err');o.textContent='Peta jalan © OpenStreetMap contributors  · perlu internet'}).attr('href',d=>d.u),up=>up,ex=>ex.remove())
    .attr('x',d=>d.x).attr('y',d=>d.y).attr('width',d=>d.w+0.6/t.k).attr('height',d=>d.h+0.6/t.k);
}
function rescale(k){
  gPin.selectAll('g.pin').attr('transform',d=>`translate(${d.p[0]},${d.p[1]}) scale(${1/k})`).select('.tag').attr('display',d=>k>(d.k==='m'?9:2.5)?null:'none');
  gTgt.selectAll('g.tgt').attr('transform',d=>`translate(${d.c[0]},${d.c[1]}) scale(${1/k})`);
  gBadge.selectAll('g.badge').attr('transform',d=>`translate(${d.c[0]},${d.c[1]}) scale(${1/k})`)
    .select('.mt').attr('display',d=>(BW.get(d.f)||0)*k>70?null:'none');
  gLab.selectAll('text').style('font-size',(11.5/k)+'px').style('stroke-width',(3/k)+'px').attr('dy',(-14/k))
    .attr('display',d=>(BW.get(d)||0)*k>48?null:'none');
}
function zoomTo(feats,pad=0.85){
  const b=path.bounds({type:'FeatureCollection',features:feats});
  const dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],x=(b[0][0]+b[1][0])/2,y=(b[0][1]+b[1][1])/2;
  const k=Math.min(400,pad/Math.max(dx/W,dy/H));
  svg.transition().duration(matchMedia('(prefers-reduced-motion:reduce)').matches?0:650)
    .call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-x,-y));
}

const tip=document.getElementById('tip');
let AG=new Map();
function tipHTML(f){
  if(mode==='target'){const t=tgOf(f);if(t){const dd=level==='dun'?TG.D[t.d]||{}:t;return `<b>${nameOf[level](f)}</b><div class="k">Skor sasaran <i>${t.score}/100</i></div><div class="k">Status <i>${t.tier}</i></div><div class="k">Sektor kerajaan <i>${t.gov} lokasi</i></div><div class="k">Perodua <i>${t.per||0} cawangan</i></div><div class="k">Proton <i>${t.pro||0} outlet</i></div>`+(dd.inc?`<div class="k">Pendapatan penengah <i>RM${fmt(dd.inc)}</i></div>`:'')+(dd.dens?`<div class="k">Kepadatan <i>${fmt(dd.dens)}/km²</i></div>`:'')}}
  const a=AG.get(key[level](f)), p=popOf(f), U=DS[ds].unit;
  let h=`<b>${nameOf[level](f)}</b><div class="k">${U[0].toUpperCase()+U.slice(1)} <i>${a?fmt(a.n):0}</i></div>`;
  if(a)h+=`<div class="k">Model teratas <i>${a.top[0][0]} (${Math.round(a.top[0][1]/a.n*100)}%)</i></div>`;
  if(p)h+=`<div class="k">Penduduk 2025 <i>${fmt(p.pop)}</i></div><div class="k">Kepadatan <i>${fmt(p.dens)}/km²</i></div>`;
  return h;
}

function legend(max,dmax,models){
  const L=document.getElementById('legend'), U=DS[ds].unit;
  if(mode==='target') L.innerHTML=`<span class="lbl">Skor sasaran conquer · Kelantan</span><div class="ramp" style="background:linear-gradient(90deg,${['--g0','--g1','--g2','--g3','--g4'].map(css).join(',')})"></div><div class="ramp-l"><span>Pantau</span><span>Kedua</span><span>Utama</span></div><div class="sw"><span><i class="dot" style="background:var(--jm)"></i>JM (kita)</span><span><i class="dot" style="background:var(--px)"></i>Proton</span><span><i class="dot" style="background:var(--pd)"></i>Perodua</span><span><i class="dot" style="background:var(--gv);transform:rotate(45deg)"></i>Kerajaan</span><span><i class="dot" style="border:2px solid var(--g4);background:none;border-radius:50%"></i>Sasaran utama (OP)</span><span><i class="dot" style="background:none;border-top:2px dashed var(--jm);border-radius:0;height:0;width:14px"></i>Laluan dari markas</span><span><i class="dot" style="background:var(--ps);border-radius:2px"></i>Pasar pagi/minggu</span><span><i class="dot" style="background:rgba(124,255,107,.35);border:1px solid var(--ps);border-radius:2px"></i>Pasar harian</span><span><i class="dot" style="background:var(--pm);border-radius:2px"></i>Pasar malam</span></div>`;
  else if(mode==='radar') L.innerHTML=`<span class="lbl">Intensiti customer · radar</span><div class="ramp" style="background:linear-gradient(90deg,${['--r1','--r2','--r3','--r4','--r5','--r6','--r7'].map(css).join(',')})"></div><div class="ramp-l"><span>Rendah</span><span>Sederhana</span><span>Lebat</span><span>${fmt(max)}</span></div>`;
  else if(mode==='cust'&&level==='negeri') L.innerHTML=`<span class="lbl">Setiap negeri warna sendiri · lebih pekat = lebih ramai</span><div class="sw">${models.st.map(k=>`<span><i class="dot" style="background:${stCol(k).formatHex()}"></i>${NAMA[k]}</span>`).join('')}</div>`;
  else if(mode==='cust') L.innerHTML=`<span class="lbl">${U[0].toUpperCase()+U.slice(1)} ikut ${LV[level]} · gelap = paling ramai</span><div class="ramp" style="background:linear-gradient(90deg,${css('--lo')},${css('--hi')})"></div><div class="ramp-l"><span>1</span><span>${fmt(max)}</span></div>`;
  else if(mode==='dens') L.innerHTML=`<span class="lbl">Penduduk per km² (anggaran 2025)</span><div class="ramp" style="background:linear-gradient(90deg,${['--t1','--t2','--t3','--t4','--t5'].map(css).join(',')})"></div><div class="ramp-l"><span>${fmt(dmax[0])}</span><span>${fmt(dmax[1])}</span></div><span class="src">Data penduduk untuk daerah Kelantan sahaja</span>`;
  else L.innerHTML=`<span class="lbl">Model paling banyak di kawasan</span><div class="sw">${models.map(m=>`<span><i class="dot" style="background:${mcol(m)}"></i>${m}</span>`).join('')}</div>`;
}

const HARI=['Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu','Ahad'], HS={Isnin:'ISN',Selasa:'SEL',Rabu:'RAB',Khamis:'KHA',Jumaat:'JUM',Sabtu:'SAB',Ahad:'AHD'};
const daysOf=o=>HARI.filter(h=>o.hari.includes(h));
const pGlyph=o=>o.t==='malam'?'☾':o.t==='harian'?'H':'M';
const pJenis=o=>o.t==='malam'?'Pasar malam':o.t==='harian'?'Pasar harian':'Pasar pagi / mingguan';
const pSort=(a,b)=>{const da=daysOf(a),db=daysOf(b);return (da.length?HARI.indexOf(da[0]):9)-(db.length?HARI.indexOf(db[0]):9)||a.n.localeCompare(b.n)};
function opsMap(lv){const src=lv==='daerah'?TG.D:TG.N;const m=new Map();Object.entries(src).filter(x=>x[1].tier==='Sasaran utama').sort((a,b)=>b[1].score-a[1].score).forEach(([k],i)=>m.set(k,'OP-'+String(i+1).padStart(2,'0')));return m}
function draw(){
  if(mode==='dens'&&level!=='daerah')setLevel('daerah');
  if(mode==='target'&&level==='negeri')setLevel('daerah');
  const rows=filt(), feats=G[level].features; AG=agg(rows);
  const max=Math.max(1,...[...AG.values()].map(a=>a.n));
  const land=css('--land');
  const cCol=d3.scaleSequentialSqrt(d3.interpolateRgb(css('--lo'),css('--hi'))).domain([0,max]);
  const dv=Object.values(POP.d).map(p=>p.dens), dext=[d3.min(dv),d3.max(dv)];
  const dCol=d3.scaleSequentialLog(TEMP()).domain(dext); const rCol=RAMP(); const tOf=n=>Math.sqrt(n/max);
  const gCol=TGC();
  const fillOf=f=>{const k=key[level](f),a=AG.get(k);
    if(mode==='target'){const t=tgOf(f);return t?gCol(t.score/100):land}
    if(mode==='radar'){if(!a)return land;const c=d3.color(rCol(tOf(a.n)));c.opacity=.16+.22*tOf(a.n);return c.formatRgb()}
    if(level==='negeri'&&mode==='cust'){if(!a)return land;const c=stCol(k);c.opacity=.3+.7*Math.sqrt(a.n/max);return c.formatRgb()}
    if(mode==='dens'){const p=POP.d[k];return p?dCol(p.dens):land}
    if(!a)return land;
    if(mode==='model'){const c=d3.color(mcol(a.top[0][0]));const t=Math.min(1,.35+.65*Math.sqrt(a.n/max));c.opacity=t;return c.formatRgb()}
    return cCol(a.n)};
  const tops=[...new Set([...AG.values()].map(a=>a.top[0][0]))].sort((x,y)=>(MSLOT[x]||99)-(MSLOT[y]||99));
  tops.st=[...AG.keys()].filter(k=>STH[k]!=null).sort((a,b)=>AG.get(b).n-AG.get(a).n);
  legend(max,dext,tops);

  const sh=gShape.selectAll('path').data(feats,key[level]);

function agg2(rows){const t=tally(rows,r=>r.m);return t.length?t:null}
function tally(rows,fn){const m=new Map();rows.forEach(r=>{const k=fn(r);if(k)m.set(k,(m.get(k)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1])}
const stack=t=>{const n=d3.sum(t,x=>x[1]);return `<div class="stack" role="img" aria-label="Pecahan model">${t.map(([m,v])=>`<i style="width:${(v/n*100).toFixed(2)}%;background:${mcol(m)}" title="${m} ${v}"></i>`).join('')}</div>`};
function modelBlock(rows,title){
  const t=tally(rows,r=>r.m); if(!t.length)return '';
  const n=rows.length;
  return `<div><h3>${title}</h3>${stack(t)}<div class="mlist">${t.slice(0,10).map(([m,v])=>`<i class="dot" style="background:${mcol(m)}"></i><span>${m}</span><span class="p">${(v/n*100).toFixed(0)}%</span><span class="v">${fmt(v)}</span>`).join('')}</div></div>`;
}
function list(title,arr,clickLevel,limit){

}
